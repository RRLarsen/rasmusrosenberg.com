- id: sackris-2019-carroll
  status: published
  type: article
  title: A consideration of Carroll’s content theory
  authors:
    - { family: Sackris, given: D. }
    - { family: Larsen, given: Rasmus Rosenberg, me: true }
  date: "2019"
  venue: The Journal of Value Inquiry
  volume: "54"
  pages: "245\u2013255"
  doi: 10.1007/s10790-019-09693-6
  openalex_id: W2948121884
  tags: [moral-and-aesthetic-judgment]
  abstract: "In this paper, we consider Noël Carroll’s Content Theory (CT) (2015) and argue that a key problem with CT is that it can be interpreted in two distinct ways: as a descriptive theory of aesthetic experience and as a normative prescriptive theory. Although CT is presented as a descriptive theory of experience, much of what Carroll says implies that CT can also be understood as a theory about how one ought to look at artworks. We argue that when understood as a descriptive theory, CT fails to qualify as a meaningful theory of aesthetic experience. We then interpret the theory prescriptively. Ultimately, this second interpretation is also found lacking: if the aim of the theory is to instruct one on how to view art, it is no longer an attempt to characterize the experience of art. We conclude by arguing that the main flaw in CT is its approach: we cannot meaningfully characterize an experience by enumerating the objects that supposedly cause said experience, and any theory that takes such an approach is likely to be unsuccessful."

- id: larsen-2018-false-positives
  status: published
  type: article
  title: "False-positives in psychopathy assessment: Proposing theory-driven exclusion criteria in research sampling"
  authors:
    - { family: Larsen, given: Rasmus Rosenberg, me: true }
  date: "2018"
  venue: European Journal of Analytic Philosophy
  volume: "14"
  issue: "1"
  pages: "33\u201352"
  doi: 10.31820/ejap.14.1.2
  openalex_id: W2904053442
  abstract: >-
    Recent debates in psychopathy studies have articulated concerns about false-positives in
    assessment and research sampling. These are pressing concerns for research progress,
    since scientific quality depends on sample quality, that is, if we wish to study
    psychopathy we must be certain that the individuals we study are, in fact, psychopaths.
    Thus, if conventional assessment tools yield substantial false-positives, this would
    explain why central research is laden with discrepancies and nonreplicable findings.
    This paper draws on moral psychology in order to develop tentative theory-driven
    exclusion criteria applicable in research sampling. Implementing standardized procedures
    to discriminate between research participants has the potential to yield more homogenous
    and discrete samples, a vital prerequisite for research progress in etiology,
    epidemiology, and treatment strategies.
  tags: [psychopathy]

