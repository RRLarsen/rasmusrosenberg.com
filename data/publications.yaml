- id: larsen-2020-mapping-patient-experience
  status: published
  type: article
  title: "Mapping the patient’s experience: An applied ontological framework for phenomenological psychopathology"
  authors:
    - { family: Larsen, given: Rasmus Rosenberg, me: true }
    - { family: Hastings, given: J. }
  date: "2020"
  venue: Phenomenology and Mind
  volume: "18"
  pages: "200\u2013219"
  doi: 10.17454/pam-1815
  openalex_id: W3081569918
  pdf: http://journals.openedition.org/phenomenology/pdf/1573
  abstract: >-
    Mental health research faces a suite of unresolved challenges that have contributed to a
    stagnation of research efforts and treatment innovation.One such challenge is how to
    reliably and validly account for the subjective side of patient symptomatology, that is,
    the patient's inner experiences or patient phenomenology.Providing a structured,
    standardised semantics for patient phenomenology would enable future research in novel
    directions.In this contribution, we aim at initiating a standardized approach to patient
    phenomenology by sketching a tentative formalisation within the framework of an applied
    ontology, in the broader context of existing open-source Open Biomedical Ontologies
    resources such as the Mental Functioning Ontology.We further discuss a number of
    prevailing challenges and observations bearing on this task.
  tags: [psychiatry-and-ontology]

- id: larsen-2020-moral-blindness
  status: published
  type: article
  title: "Psychopathy as moral blindness: A qualifying exploration of the blindness-analogy in psychopathy theory and research"
  authors:
    - { family: Larsen, given: Rasmus Rosenberg, me: true }
  date: "2020"
  venue: Philosophical Explorations
  volume: "23"
  issue: "3"
  pages: "214\u2013233"
  doi: 10.1080/13869795.2020.1799662
  openalex_id: W3046455652
  pdf: https://philpapers.org/archive/LARPAM-2.pdf
  abstract: >-
    The term psychopathy refers to a personality disorder associated with callous
    personality traits and antisocial behaviors. Throughout its research history,
    psychopathy has frequently been described as a peculiar form of moral blindness,
    engendering a narrative about a patient stereotype incapable of taking a genuine moral
    perspective, similar to a blind person who is deprived of proper visual perceptions.
    However, recent empirical research has shown that clinically diagnosed psychopaths are
    morally more fit than initially thought, and the blindness-analogy now comes across as
    largely misleading. In this contribution, the moral-blindness analogy is explored in an
    attempt to qualify anew its relevance in psychopathy theory and research. It is
    demonstrated that there are indeed theoretically relevant parallels to be drawn between
    blindness and psychopathy, parallels that are especially illuminating when accounting
    for the potential symptomatology, dimensionality, and etiological nature of the
    disorder.
  tags: [psychopathy, moral-and-aesthetic-judgment]

- id: larsen-2020-feeling-the-aesthetic
  status: published
  type: article
  title: "Feeling the aesthetic: A pluralist sentimentalist theory of aesthetic experience"
  authors:
    - { family: Larsen, given: Rasmus Rosenberg, me: true }
    - { family: Sackris, given: D. }
  date: "2020"
  venue: Estetika
  volume: "57"
  issue: "2"
  pages: "116\u2013134"
  doi: 10.33134/eeja.212
  openalex_id: W3086910899
  abstract: >-
    Sentimentalist aesthetic theories, broadly construed, posit that emotions play a
    fundamental role in aesthetic experiences. Jesse Prinz has recently proposed a
    reductionistic version of sentimentalist aesthetics, suggesting that it is the discrete
    feeling of wonder that makes an experience aesthetic. In this contribution, we draw on
    Prinz’s proposal in order to outline a novel version of a sentimentalist theory.
    Contrasting Prinz’s focus on a single emotion, we argue that an aesthetic experience is
    rudimentarily composed of a plurality of emotions. We acknowledge and discuss
    significant problems that follow from such a theory, arguing that a pluralist version of
    sentimentalism is nonetheless the soundest position within sentimentalist aesthetics.
  tags: [moral-and-aesthetic-judgment]

