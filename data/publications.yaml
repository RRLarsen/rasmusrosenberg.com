- id: deming-2024-medial-frontal-cortex
  status: published
  type: article
  title: "Psychopathy and medial frontal cortex: A systematic review reveals predominantly null relationships"
  authors:
    - { family: Deming, given: P. }
    - { family: Griffiths, given: S. }
    - { family: Jalava, given: J. }
    - { family: Koenigs, given: M. }
    - { family: Larsen, given: Rasmus Rosenberg, me: true }
  date: "2024"
  venue: Neuroscience & Biobehavioral Reviews
  volume: "167"
  pages: "105904"
  doi: 10.1016/j.neubiorev.2024.105904
  openalex_id: W4402943393
  abstract: >-
    Theories have posited that psychopathy is caused by dysfunction in the medial frontal
    cortex, including ventromedial prefrontal cortex (vmPFC), anterior cingulate cortex
    (ACC), and dorsomedial prefrontal cortex (dmPFC). Recent reviews have questioned the
    reproducibility of neuroimaging findings within this field. We conducted a systematic
    review to describe the consistency of magnetic resonance imaging (MRI) findings
    according to anatomical subregion (vmPFC, ACC, dmPFC), experimental task, psychopathy
    assessment, study power, and peak coordinates of significant effects. Searches of
    PsycInfo and MEDLINE databases produced 77 functional and 24 structural MRI studies that
    analyzed the medial frontal cortex in relation to psychopathy in adult samples. Findings
    were predominantly null (85.4 % of 1573 tests across the three medial frontal regions).
    Studies with higher power observed null effects at marginally lower rates. Finally, peak
    coordinates of significant effects were widely dispersed. The evidence failed to support
    theories positing the medial frontal cortex as a consistent neural correlate of
    psychopathy. Theory and methods in the field should be revised to account for
    predominantly null neuroimaging findings.
  tags: [psychopathy]

- id: sackris-2024-disunity-moral-judgment
  status: published
  type: article
  title: "The disunity of moral judgment: Evidence and implications"
  authors:
    - { family: Sackris, given: D. }
    - { family: Larsen, given: Rasmus Rosenberg, me: true }
  date: "2024"
  venue: Philosophical Psychology
  volume: "37"
  issue: "2"
  pages: "351\u2013370"
  doi: 10.1080/09515089.2022.2056437
  openalex_id: W4220860588
  pdf: https://philpapers.org/archive/SACTDO-4.pdf
  abstract: >-
    We argue that there is significant evidence for reconsidering the possibility that moral
    judgment constitutes a distinctive category of judgment. We begin by reviewing evidence
    and arguments from neuroscience and philosophy that seem to indicate that a diversity of
    brain processes result in verdicts that we ordinarily consider “moral judgments”. We
    argue that if these findings are correct, this is plausible reason for doubting that all
    moral judgments necessarily share common features: if diverse brain processes give rise
    to what we refer to as “moral judgments”, then we have reason to suspect that these
    judgments may have different features. After advancing this argument, we show that
    giving up the unity of moral judgment seems to effectively dissolve the
    internalism/externalism debate concerning motivation within the field of metaethics.
  tags: [moral-and-aesthetic-judgment]

