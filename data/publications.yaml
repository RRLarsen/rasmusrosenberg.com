- id: larsen-2025-canadian-case-law
  status: published
  type: article
  title: "The use of psychopathy assessments in Canadian case law: A quantitative and qualitative survey of court records from 1980–2023"
  authors:
    - { family: Larsen, given: Rasmus Rosenberg, me: true }
    - { family: Ades, given: Emilie }
    - { family: Shroff, given: Yashika }
    - { family: McLaren, given: Sonya Anna }
    - { family: Griffiths, given: Stephanie }
    - { family: Jalava, given: Jarkko }
    - { family: DeMatteo, given: David }
  date: "2026"
  venue: Psychology, Public Policy, and Law
  volume: "32"
  issue: "1"
  pages: "73\u201394"
  doi: 10.1037/law0000472
  openalex_id: W4414608922
  tags: [psychopathy, law-and-evidence]
  abstract: "This study investigated the use of psychopathy assessments in Canadian courts between 1980 and 2023. We reviewed 3,315 court cases and found that psychopathy assessments were used in two distinct ways: either as a clinical measure of psychopathy or exclusively for risk assessment purposes. Psychopathy assessments are most commonly introduced in court by prosecutors, with the Hare Psychopathy Checklist—Revised (PCL-R) being the most frequently used tool. The use of psychopathy assessments increased by 858% from the year 2000 to its peak in 2013, followed by a 10-year gradual (63%) decline. There was evidence of adversarial allegiance where prosecution-retained experts gave defendants higher PCL-R scores (d = 1.08) compared to defense-retained experts. PCL-R assessments showed poor reliability when comparing paired scores between prosecution and defense experts, suggesting a high risk of Type 1 and Type 2 errors. Intraclass correlation coefficient between prosecution- and defense-retained experts was .079 (95% confidence interval [CI] [−0.12, 0.34]), where 40% of experts had a ≥ 5.9 points scoring difference. A qualitative analysis of 183 expert testimonies on the perceived forensic risk and treatment prospects associated with psychopathy showed significant variability in expert testimonies. Most experts linked psychopathy to a high risk of recidivism (72.36%) and described it as a categorically untreatable condition (50.63%), where many experts also stated that treatment makes psychopathic persons worse (15.82%). These findings suggest that some expert testimonies on psychopathy are not aligned with the empirical research. We discuss the potential implications for legal practitioners and comment on the future role of psychopathy assessments in Canadian courts."

- id: larsen-2025-empathy
  status: published
  type: article
  title: Do psychopathic persons lack empathy? An exploratory systematic review of empathy assessment and emotion recognition studies in Psychopathy Checklist samples
  authors:
    - { family: Larsen, given: Rasmus Rosenberg, me: true }
    - { family: McLaren, given: Sonya Anna }
    - { family: Griffiths, given: Stephanie }
    - { family: Jalava, given: Jarkko }
  date: "2025"
  venue: Psychology, Public Policy, and Law
  volume: "31"
  issue: "2"
  pages: "115\u2013133"
  doi: 10.1037/law0000435
  openalex_id: W4403507994
  tags: [psychopathy]
  abstract: Psychopathy assessments are widely used in the legal system to inform decisions about sentencing, rehabilitation, etc. Recently, these assessments have become controversial as long-held beliefs about psychopathy are contested. One common claim that has yet to be scrutinized is the assumption that psychopathic persons lack empathy. This hypothesis has been studied extensively in forensic samples, but there are few relevant systematic reviews to inform forensic practices. We conducted a systematic review of empirical studies testing empathy in persons assessed with the Hare Psychopathy Checklist (PCL) scales. Included studies (n = 66) measured general, cognitive, and affective empathy across two different paradigms using (a) empathy assessment tools and (b) emotion recognition tests. These studies had great heterogeneity in their reporting of effects, precluding a meaningful meta-analysis. A structured overview of results showed a total of 1,672 effects were reported across 66 included studies (N = 5,711) of which 182 effects (10.89%) were statistically significant and 1,490 effects (89.11%) were nulls. Exploratory analyses revealed that high-powered studies had a significantly larger proportion of nulls (89.29%) compared to low-powered studies (81.45%), suggesting a potential problem with false-positive discoveries in the research literature. In conclusion, we found little evidence to suggest that PCL psychopathic persons have different empathic capacities, thus challenging the common assumption that psychopathy is associated with a lack of empathy. We discuss the implication of these results for the current and future use of PCL assessment in forensic settings.

- id: deming-2024-medial-frontal-cortex
  status: published
  type: article
  title: "Psychopathy and medial frontal cortex: A systematic review reveals predominantly null relationships"
  authors:
    - { family: Deming, given: P. }
    - { family: Griffiths, given: S. }
    - { family: Jalava, given: J. }
    - { family: Koenigs, given: M. }
    - { family: Larsen, given: Rasmus Rosenberg, me: true }
  date: "2024"
  venue: Neuroscience & Biobehavioral Reviews
  volume: "167"
  pages: "105904"
  doi: 10.1016/j.neubiorev.2024.105904
  openalex_id: W4402943393
  abstract: >-
    Theories have posited that psychopathy is caused by dysfunction in the medial frontal
    cortex, including ventromedial prefrontal cortex (vmPFC), anterior cingulate cortex
    (ACC), and dorsomedial prefrontal cortex (dmPFC). Recent reviews have questioned the
    reproducibility of neuroimaging findings within this field. We conducted a systematic
    review to describe the consistency of magnetic resonance imaging (MRI) findings
    according to anatomical subregion (vmPFC, ACC, dmPFC), experimental task, psychopathy
    assessment, study power, and peak coordinates of significant effects. Searches of
    PsycInfo and MEDLINE databases produced 77 functional and 24 structural MRI studies that
    analyzed the medial frontal cortex in relation to psychopathy in adult samples. Findings
    were predominantly null (85.4 % of 1573 tests across the three medial frontal regions).
    Studies with higher power observed null effects at marginally lower rates. Finally, peak
    coordinates of significant effects were widely dispersed. The evidence failed to support
    theories positing the medial frontal cortex as a consistent neural correlate of
    psychopathy. Theory and methods in the field should be revised to account for
    predominantly null neuroimaging findings.
  tags: [psychopathy]

- id: sackris-2024-disunity-moral-judgment
  status: published
  type: article
  title: "The disunity of moral judgment: Evidence and implications"
  authors:
    - { family: Sackris, given: D. }
    - { family: Larsen, given: Rasmus Rosenberg, me: true }
  date: "2024"
  venue: Philosophical Psychology
  volume: "37"
  issue: "2"
  pages: "351\u2013370"
  doi: 10.1080/09515089.2022.2056437
  openalex_id: W4220860588
  pdf: https://philpapers.org/archive/SACTDO-4.pdf
  abstract: >-
    We argue that there is significant evidence for reconsidering the possibility that moral
    judgment constitutes a distinctive category of judgment. We begin by reviewing evidence
    and arguments from neuroscience and philosophy that seem to indicate that a diversity of
    brain processes result in verdicts that we ordinarily consider “moral judgments”. We
    argue that if these findings are correct, this is plausible reason for doubting that all
    moral judgments necessarily share common features: if diverse brain processes give rise
    to what we refer to as “moral judgments”, then we have reason to suspect that these
    judgments may have different features. After advancing this argument, we show that
    giving up the unity of moral judgment seems to effectively dissolve the
    internalism/externalism debate concerning motivation within the field of metaethics.
  tags: [moral-and-aesthetic-judgment]

