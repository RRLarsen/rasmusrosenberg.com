- id: sackris-2023-higher-order-evidence
  status: published
  type: article
  title: The perniciousness of higher-order evidence on aesthetic appreciation
  authors:
    - { family: Sackris, given: D. }
    - { family: Larsen, given: Rasmus Rosenberg, me: true }
  date: "2023"
  venue: "Dialogue: Canadian Philosophical Review"
  pages: "1\u201320"
  doi: 10.1017/S0012217323000070
  openalex_id: W4378800411
  pdf: https://www.cambridge.org/core/services/aop-cambridge-core/content/view/3C7CCEBFEDBCEBA76656E75A1F52093F/S0012217323000070a.pdf/div-class-title-the-perniciousness-of-higher-order-evidence-on-aesthetic-appreciation-div.pdf
  abstract: >-
    We demonstrate that many philosophers accept the following claim: When an aesthetic
    object is apprehended correctly, taking pleasure in said object is a reliable sign that
    the object is aesthetically successful. We undermine this position by showing that what
    grounds our pleasurable experience is opaque: In many cases, the experienced pleasure is
    attributable to factors that have little to do with the aesthetic object. The evidence
    appealed to is a form of Higher-Order Evidence (HOE) and we consider attempts to
    overcome said evidence. We argue they are unsuccessful. We conclude by considering what
    this means for our practice of making aesthetic judgements.
  tags: [moral-and-aesthetic-judgment]

- id: jalava-2023-neuroimaging-evidence
  status: published
  type: article
  title: "How to keep unreproducible neuroimaging evidence out of court: A case study in fMRI and psychopathy"
  authors:
    - { family: Jalava, given: J. }
    - { family: Griffiths, given: S. }
    - { family: Larsen, given: Rasmus Rosenberg, me: true }
  date: "2023"
  venue: Psychology, Public Policy, and Law
  volume: "29"
  issue: "1"
  pages: "1\u201318"
  doi: 10.1037/law0000383
  openalex_id: W4327627519
  tags: [psychopathy, law-and-evidence]
  featured: true
  abstract: "The amount of neuroimaging evidence introduced in courts continues to increase. Meanwhile, neuroimaging research is in the midst of a reproducibility crisis, as many published findings appear to be false positives. The problem is mostly due to small sample sizes, lack of direct replications, and questionable research practices. There are concerns that a significant proportion of neuroimaging evidence introduced in court may therefore be unreliable. Guidelines governing the admissibility of scientific evidence—Frye and Daubert—are not designed to weed out such data. We propose supplementing Frye and Daubert with minimal reproducibility criteria that allow judges to make informed admissibility decisions about neuroimaging research. To demonstrate how this could work, we subjected functional magnetic resonance imaging (fMRI) findings on psychopathy—evidence that has been admitted in court—to a minimal reproducibility test. A systematic PRISMA search found 64 relevant studies but no sufficiently powered, directly replicated evidence of a psychopathy-related neurobiological profile. This illustrates two things: (a) the probability of false positives in this data set is likely to be unacceptably high and (b) the reproducibility of similar neuroimaging evidence can be evaluated in a straightforward way. Our findings suggest an urgent need to modify admissibility guidelines to exclude low-quality neuroimaging data."

- id: sackris-2023-moral-judgments
  status: published
  type: article
  title: Are there “moral” judgments?
  authors:
    - { family: Sackris, given: D. }
    - { family: Larsen, given: Rasmus Rosenberg, me: true }
  date: "2023"
  venue: European Journal of Analytic Philosophy
  volume: "19"
  issue: "2"
  pages: "1\u201323"
  doi: 10.31820/ejap.19.2.1
  openalex_id: W4382618844
  pdf: https://hrcak.srce.hr/file/434498
  abstract: >-
    Recent contributions in moral philosophy have raised questions concerning the prevalent
    assumption that moral judgments are typologically discrete, and thereby distinct from
    ordinary and/or other types of judgments. This paper adds to this discourse, surveying
    how attempts at defining what makes moral judgments distinct have serious shortcomings,
    and it is argued that any typological definition is likely to fail due to certain
    questionable assumptions about the nature of judgment itself. The paper concludes by
    raising questions for future investigations into the nature of moral judgment.
  tags: [moral-and-aesthetic-judgment]

- id: sackris-2023-aesthetic-judgments
  status: published
  type: article
  title: Are there “aesthetic” judgments?
  authors:
    - { family: Sackris, given: D. }
    - { family: Larsen, given: Rasmus Rosenberg, me: true }
  date: "2023"
  venue: Erkenntnis
  doi: 10.1007/s10670-023-00663-w
  openalex_id: W4321231549
  tags: [moral-and-aesthetic-judgment]
  abstract: In philosophy of aesthetics, scholars commonly express a commitment to the premise that there is a distinctive type of judgment that can be meaningfully labeled “aesthetic”, and that these judgments are distinctively different from other types of judgments. We argue that, within an Aristotelian framework, there is no clear avenue for meaningfully differentiating “aesthetic” judgment from other types of judgment, and, as such, we aim to question the assumption that aesthetic judgment does in fact constitute a distinctive kind of judgment that is in need of, or can be subject to, distinctive theorizing. We advance our argument primarily through demonstrating that leading contemporary accounts of aesthetic judgment do not successfully distinguish a type of judgment in that they do not tell us how making an aesthetic judgment differs substantially from judging that 2 + 3 = 5, that football is entertaining, or that today is Tuesday.

