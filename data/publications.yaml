- id: larsen-2018-false-positives
  status: published
  type: article
  title: "False-positives in psychopathy assessment: Proposing theory-driven exclusion criteria in research sampling"
  authors:
    - { family: Larsen, given: Rasmus Rosenberg, me: true }
  date: "2018"
  venue: European Journal of Analytic Philosophy
  volume: "14"
  issue: "1"
  pages: "33\u201352"
  doi: 10.31820/ejap.14.1.2
  openalex_id: W2904053442
  abstract: >-
    Recent debates in psychopathy studies have articulated concerns about false-positives in
    assessment and research sampling. These are pressing concerns for research progress,
    since scientific quality depends on sample quality, that is, if we wish to study
    psychopathy we must be certain that the individuals we study are, in fact, psychopaths.
    Thus, if conventional assessment tools yield substantial false-positives, this would
    explain why central research is laden with discrepancies and nonreplicable findings.
    This paper draws on moral psychology in order to develop tentative theory-driven
    exclusion criteria applicable in research sampling. Implementing standardized procedures
    to discriminate between research participants has the potential to yield more homogenous
    and discrete samples, a vital prerequisite for research progress in etiology,
    epidemiology, and treatment strategies.
  tags: [psychopathy]

- id: larsen-2018-affective-science
  status: published
  type: article
  title: "From affective science to psychiatric disorder: Ontology as semantic bridge"
  authors:
    - { family: Larsen, given: Rasmus Rosenberg, me: true }
    - { family: Hastings, given: J. }
  date: "2018"
  venue: Frontiers in Psychiatry
  volume: "9"
  pages: "487"
  doi: 10.3389/fpsyt.2018.00487
  openalex_id: W2897242206
  pdf: https://www.frontiersin.org/articles/10.3389/fpsyt.2018.00487/pdf
  abstract: >-
    Advances in emotion and affective science have yet to translate routinely into
    psychiatric research and practice. This is unfortunate since emotion and affect are
    fundamental components of many psychiatric conditions. Rectifying this lack of
    interdisciplinary integration could thus be a potential avenue for improving psychiatric
    diagnosis and treatment. In this contribution, we propose and discuss an ontological
    framework for explicitly capturing the complex interrelations between affective entities
    and psychiatric disorders, in order to facilitate mapping and integration between
    affective science and psychiatric diagnostics. We build on and enhance the
    categorisation of emotion, affect and mood within the previously developed Emotion
    Ontology, and that of psychiatric disorders in the Mental Disease Ontology. This effort
    further draws on developments in formal ontology regarding the distinction between
    normal and abnormal in order to formalize the interconnections. This operational
    semantic framework is relevant for applications including clarifying psychiatric
    diagnostic categories, clinical information systems, and the integration and translation
    of research results across disciplines.
  tags: [psychiatry-and-ontology]

- id: larsen-2015-posited-self
  status: published
  type: article
  title: "The posited self: The non-theistic foundation in Kierkegaard’s writings"
  authors:
    - { family: Larsen, given: Rasmus Rosenberg, me: true }
  date: "2015"
  venue: Kierkegaard Studies Yearbook
  volume: "20"
  issue: "1"
  pages: "31\u201354"
  doi: 10.1515/kierke-2015-0104
  openalex_id: W2562831728
  abstract: >-
    We may correctly say that Søren Kierkegaard is one of the most influential
    Christian-religious thinkers of the modern era, but are we equally justified in
    categorizing his writings as foundationally religious? This paper challenges a
    prevailing exclusive-theological interpretation that contends that Kierkegaard
    principally writes from a Christian dogmatic viewpoint. I argue that Kierkegaard’s
    religion is better understood as an outcome of his philosophical analysis of human
    nature. Conclusively, we should appreciate Kierkegaard first as a philosopher, whose aim
    is the explication of human subjectivity, and not primarily as an orator of Christian
    orthodoxy
  tags: [history-of-philosophy]

- id: larsen-2013-schelling-kierkegaard
  status: published
  type: article
  title: "Schelling and Kierkegaard in perspective: Integrating existence into idealism"
  authors:
    - { family: Larsen, given: Rasmus Rosenberg, me: true }
  date: "2013"
  venue: Res Philosophica
  volume: "90"
  issue: "4"
  pages: "481\u2013501"
  doi: 10.11612/resphil.2013.90.4.3
  openalex_id: W889432237
  pdf: https://philpapers.org/archive/LARSAK.pdf
  abstract: >-
    Søren Kierkegaard is often considered to be one of the most vocal critics of German
    idealism.The present paper analyzes the philosophical similarity between Friedrich
    Schelling's early idealistic work and Kierkegaard's existential writings, endeavoring to
    display Schelling's epic 1809 publication Philosophical Investigations into the Essence
    of Human Freedom as a possible forerunner to Kierkegaard.This juxtaposition reveals
    concrete similarity that supports the thesis that Schelling's work could have been of
    great inspirational value for Kierkegaard, especially Kierkegaard's core concepts such
    as freedom, morality and God.However, Schelling's early work is primarily appreciated as
    a philosophy of nature (metaphysics), and therefore fundamentally different from
    Kierkegaard's theistic-psychological writings.The present paper tentatively opposes this
    distinction, concluding that if Schelling really is a forerunner to Kierkegaard, then we
    ought to appreciate Kierkegaard's writings as conveying more than a theological
    message.The conclusion suggests that Kierkegaard's writings should be interpreted in a
    broader philosophical context, closer to the metaphysical idealism he is often assumed
    to resist.Only one who has tasted freedom can feel the longing to make everything
    analogous to it, to spread it throughout the whole universe.
  tags: [history-of-philosophy]

