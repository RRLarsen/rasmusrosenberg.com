- id: larsen-2020-pcl-systematic-review
  status: published
  type: article
  title: Are Psychopathy Checklist (PCL) psychopaths dangerous, untreatable, and without conscience? A systematic review of the empirical evidence
  authors:
    - { family: Larsen, given: Rasmus Rosenberg, me: true }
    - { family: Jalava, given: J. }
    - { family: Griffiths, given: S. }
  date: "2020"
  venue: Psychology, Public Policy, and Law
  volume: "26"
  issue: "3"
  pages: "297\u2013311"
  doi: 10.1037/law0000239
  openalex_id: W3027084836
  tags: [psychopathy, law-and-evidence]
  featured: true
  abstract: The Hare Psychopathy Checklist (PCL; Hare, Neumann, & Mokros 2018) scales are among the most widely used forensic assessment tools. Their perceived utility rests partly on their ability to assess stable personality traits indicative of a lack of conscience, which then facilitates behavioral predictions useful in forensic decisions. In this systematic review, we evaluate the empirical evidence behind 3 fundamental justifications for using the PCL scales in forensics, namely, that they are empirically predictive of (1) criminal behavior, (2) treatment outcomes, and (3) a lack of conscience. We found the PCL scales can predict criminal behavior to a statistically significant degree, though with important limitations. We found no evidence of PCL psychopathy being predictive of treatment and rehabilitation outcomes. We found no evidence of PCL psychopathy being predictive of a lack of conscience. These findings disprove widespread beliefs about PCL psychopathy among forensic practitioners and questions the current and future role of the PCL scales in forensic settings.

- id: larsen-2020-mapping-patient-experience
  status: published
  type: article
  title: "Mapping the patient’s experience: An applied ontological framework for phenomenological psychopathology"
  authors:
    - { family: Larsen, given: Rasmus Rosenberg, me: true }
    - { family: Hastings, given: J. }
  date: "2020"
  venue: Phenomenology and Mind
  volume: "18"
  pages: "200\u2013219"
  doi: 10.17454/pam-1815
  openalex_id: W3081569918
  pdf: http://journals.openedition.org/phenomenology/pdf/1573
  abstract: >-
    Mental health research faces a suite of unresolved challenges that have contributed to a
    stagnation of research efforts and treatment innovation.One such challenge is how to
    reliably and validly account for the subjective side of patient symptomatology, that is,
    the patient's inner experiences or patient phenomenology.Providing a structured,
    standardised semantics for patient phenomenology would enable future research in novel
    directions.In this contribution, we aim at initiating a standardized approach to patient
    phenomenology by sketching a tentative formalisation within the framework of an applied
    ontology, in the broader context of existing open-source Open Biomedical Ontologies
    resources such as the Mental Functioning Ontology.We further discuss a number of
    prevailing challenges and observations bearing on this task.
  tags: [psychiatry-and-ontology]

- id: larsen-2020-moral-blindness
  status: published
  type: article
  title: "Psychopathy as moral blindness: A qualifying exploration of the blindness-analogy in psychopathy theory and research"
  authors:
    - { family: Larsen, given: Rasmus Rosenberg, me: true }
  date: "2020"
  venue: Philosophical Explorations
  volume: "23"
  issue: "3"
  pages: "214\u2013233"
  doi: 10.1080/13869795.2020.1799662
  openalex_id: W3046455652
  pdf: https://philpapers.org/archive/LARPAM-2.pdf
  abstract: >-
    The term psychopathy refers to a personality disorder associated with callous
    personality traits and antisocial behaviors. Throughout its research history,
    psychopathy has frequently been described as a peculiar form of moral blindness,
    engendering a narrative about a patient stereotype incapable of taking a genuine moral
    perspective, similar to a blind person who is deprived of proper visual perceptions.
    However, recent empirical research has shown that clinically diagnosed psychopaths are
    morally more fit than initially thought, and the blindness-analogy now comes across as
    largely misleading. In this contribution, the moral-blindness analogy is explored in an
    attempt to qualify anew its relevance in psychopathy theory and research. It is
    demonstrated that there are indeed theoretically relevant parallels to be drawn between
    blindness and psychopathy, parallels that are especially illuminating when accounting
    for the potential symptomatology, dimensionality, and etiological nature of the
    disorder.
  tags: [psychopathy, moral-and-aesthetic-judgment]

- id: larsen-2020-feeling-the-aesthetic
  status: published
  type: article
  title: "Feeling the aesthetic: A pluralist sentimentalist theory of aesthetic experience"
  authors:
    - { family: Larsen, given: Rasmus Rosenberg, me: true }
    - { family: Sackris, given: D. }
  date: "2020"
  venue: Estetika
  volume: "57"
  issue: "2"
  pages: "116\u2013134"
  doi: 10.33134/eeja.212
  openalex_id: W3086910899
  abstract: >-
    Sentimentalist aesthetic theories, broadly construed, posit that emotions play a
    fundamental role in aesthetic experiences. Jesse Prinz has recently proposed a
    reductionistic version of sentimentalist aesthetics, suggesting that it is the discrete
    feeling of wonder that makes an experience aesthetic. In this contribution, we draw on
    Prinz’s proposal in order to outline a novel version of a sentimentalist theory.
    Contrasting Prinz’s focus on a single emotion, we argue that an aesthetic experience is
    rudimentarily composed of a plurality of emotions. We acknowledge and discuss
    significant problems that follow from such a theory, arguing that a pluralist version of
    sentimentalism is nonetheless the soundest position within sentimentalist aesthetics.
  tags: [moral-and-aesthetic-judgment]

- id: larsen-2020-affective-science-reprint
  status: published
  type: chapter
  title: "From affective science to psychiatric disorder: Ontology as semantic bridge"
  authors:
    - { family: Larsen, given: Rasmus Rosenberg, me: true }
    - { family: Hastings, given: J. }
  editors: [D. Telles-Correia, E. Cheniaux]
  date: "2020"
  venue: New perspectives in psychopathology
  pages: "108\u2013120"
  publisher: Frontiers Media SA
  place: Lausanne
  note: Reprint of the 2018 article in Frontiers in Psychiatry
  doi: 10.3389/978-2-88963-551-1
  openalex_id: W3216948898
  tags: [psychiatry-and-ontology]
  abstract: Advances in emotion and affective science have yet to translate routinely into psychiatric research and practice. This is unfortunate since emotion and affect are fundamental components of many psychiatric conditions. Rectifying this lack of interdisciplinary integration could thus be a potential avenue for improving psychiatric diagnosis and treatment. In this contribution, we propose and discuss an ontological framework for explicitly capturing the complex interrelations between affective entities and psychiatric disorders, in order to facilitate mapping and integration between affective science and psychiatric diagnostics. We build on and enhance the categorisation of emotion, affect and mood within the previously developed Emotion Ontology, and that of psychiatric disorders in the Mental Disease Ontology. This effort further draws on developments in formal ontology regarding the distinction between normal and abnormal in order to formalize the interconnections. This operational semantic framework is relevant for applications including clarifying psychiatric diagnostic categories, clinical information systems, and the integration and translation of research results across disciplines.

- id: larsen-2019-stigma
  status: published
  type: article
  title: Psychopathy treatment and the stigma of yesterday’s research
  authors:
    - { family: Larsen, given: Rasmus Rosenberg, me: true }
  date: "2019"
  venue: Kennedy Institute of Ethics Journal
  volume: "29"
  issue: "3"
  pages: "243\u2013272"
  doi: 10.1353/ken.2019.0024
  openalex_id: W2981879119
  pdf: https://philpapers.org/archive/LARPTA.pdf
  abstract: >-
    The psychiatric diagnosis of psychopathic personality-or psychopathy-signifies a patient
    stereotype with a callous lack of empathy and strong antisocial tendencies. Throughout
    the research record and psychiatric practices, diagnosed psychopaths have been
    predominantly seen as immune to psychiatric intervention and treatment, making the
    diagnosis a potentially strong discriminator for treatment amenability. In this
    contribution, the evidence in support of this proposition is critically analyzed. It is
    demonstrated that the untreatability perspective rests largely on erroneous,
    unscientific conclusions. Instead, recent research suggests that practitioners should be
    more optimistic about the possibility of treating and rehabilitating diagnosed
    psychopaths. In light of this finding, concrete ethical challenges in the forensic
    practice surrounding the psychopathy diagnosis are discussed, adding to a growing body
    of research that expresses skepticism about the forensic utility of the diagnosis.
  tags: [psychopathy]

