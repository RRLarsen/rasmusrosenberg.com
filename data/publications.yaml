- id: larsen-2022-phenomenology-psychiatry
  status: published
  type: article
  title: More phenomenology in psychiatry? Applied ontology as a method towards integration
  authors:
    - { family: Larsen, given: Rasmus Rosenberg, me: true }
    - { family: Maschião, given: L. }
    - { family: Piedade, given: V. }
    - { family: Messas, given: G. }
    - { family: Hastings, given: J. }
  date: "2022"
  venue: The Lancet Psychiatry
  volume: "9"
  issue: "9"
  pages: "751\u2013758"
  doi: 10.1016/S2215-0366(22)00156-0
  openalex_id: W4284975158
  pdf: http://www.thelancet.com/article/S2215036622001560/pdf
  tags: [psychiatry-and-ontology]
  featured: true
  abstract: There have been renewed calls to use phenomenology in psychiatry to improve knowledge about causation, diagnostics, and treatment of mental health conditions. A phenomenological approach aims to elucidate the subjective experiences of mental health, which its advocates claim have been largely neglected by current diagnostic frameworks in psychiatry (eg, DSM-5). The consequence of neglecting rich phenomenological information is a comparatively more constrained approach to theory development, empirical research, and care programmes. Although calls for more phenomenology in psychiatry have been met with enthusiasm, there is still relatively little information on how to practically facilitate this integration. In this Personal View, we argue that phenomenological approaches need a shared semantic framework to drive their innovative potential, thus enabling consistent data capture, exchange, and interoperability with current mental health data and informatics approaches (eg, the Research Domain Criteria project). We show how an applied ontology of phenomenological psychopathology offers a suitable method to address these challenges.

- id: jalava-2022-genetic-correlates
  status: published
  type: article
  title: "Genetic correlates of PCL-R psychopathy: A systematic review"
  authors:
    - { family: Jalava, given: J. }
    - { family: Griffiths, given: S. }
    - { family: Larsen, given: Rasmus Rosenberg, me: true }
    - { family: Alcott, given: E. }
  date: "2022"
  venue: Aggression and Violent Behavior
  volume: "66"
  pages: "101765"
  doi: 10.1016/j.avb.2022.101765
  openalex_id: W4284991588
  tags: [psychopathy]
  abstract: "Background & objectives: Though it has been argued that courts should admit biogenetic evidence on psychopathy, no research to date has evaluated whether individuals with clinical psychopathy have consistent genetic correlates. The current study: 1) systematically reviewed all quantitative and molecular genetic studies of PCL-R psychopathy, and 2) assessed the quality and reproducibility of findings. Review methods: Using PRISMA guidelines, we reviewed 1 heritability and 15 molecular genetic studies of PCL-R psychopathy. Sample characteristics, research design, and the main findings of each study were qualitatively synthesized according to candidate neurotransmitter systems. We also assessed broad metrics of study quality such as sample generalizability, accounting for environmental or clinical variability in analyses, and replication of effects. Results: Heritability estimates for the facets of clinical psychopathy were low. Molecular genetic findings were inconsistent and mostly unreplicated. Further, replicated findings were contradictory; elevated dopamine metabolite levels observed in independent samples was qualified by a lack of association between a candidate dopamine polymorphism and PCL-R scores. Inconsistent findings may be related to issues with study quality. Though most studies had clear hypotheses and generalizable samples, few accounted for clinical complexity of those samples, environmental factors, or gene-environment interplay. Implications: The current review suggests that the genetic bases of PCL-R psychopathy are not robust enough for forensic application. Genetic findings in people with antisocial characteristics (violence, addiction, CU traits) may not generalize to those with PCL-R psychopathy."

- id: larsen-2022-canadian-practitioners
  status: published
  type: article
  title: "Psychopathy assessments in forensic psychiatry: A pilot study of Canadian practitioners’ use and perceptions"
  authors:
    - { family: Larsen, given: Rasmus Rosenberg, me: true }
    - { family: Griffiths, given: S. }
    - { family: Jalava, given: J. }
    - { family: Burns, given: J. }
    - { family: Khoshabe, given: R. }
    - { family: Raposo, given: N. }
    - { family: Sng, given: D. }
  date: "2022"
  venue: Journal of Criminological Research, Policy and Practice
  volume: "9"
  issue: "1"
  pages: "1\u201313"
  doi: 10.1108/JCRPP-02-2022-0007
  openalex_id: W4283391551
  abstract: >-
    Purpose The purpose of this study was to survey practitioners’ use and perceptions of
    psychopathy assessments in Canadian forensic psychiatric settings. Psychopathy
    assessments are widely used in forensic settings to inform decisions about sentencing,
    placement, rehabilitation and parole. Recent empirical evidence suggests that the
    utility of psychopathy assessments might be overestimated, leading to a debate about
    their legal and ethical justification. However, one shortcoming of these discussions is
    that they rely heavily on anecdotal evidence about how exactly psychopathy assessments
    influence forensic decisions, due to a general lack of survey data on field uses. Some
    data are available in European and American contexts, but little is known about Canadian
    clinical practice. Design/methodology/approach To address this shortcoming in the
    literature, the authors conducted a pilot study of practitioners in forensic psychiatric
    units in Ontario (N = 18), evaluating their use of psychopathy assessments, reporting
    habits and their perceptions of psychopathic offenders. Findings Practitioners reported
    that they primarily used the Hare Psychopathy Checklist-Revised (PCL-R) as a risk
    assessment tool, often in combination with other tools. Most clinicians reported using
    psychopathy assessments infrequently, that there was a low base rate of psychopathic
    offenders and their attitudes and beliefs about psychopathy were generally consistent
    with the empirical literature. Originality/value This pilot study provides novel
    insights into the use of psychopathy assessments in Canadian forensic psychiatry with
    the potential to inform current debates.
  tags: [psychopathy, law-and-evidence]

- id: hastings-2021-integrative-paradigms
  status: published
  type: chapter
  title: "Integrative paradigms for knowledge discovery in mental health: Overcoming the fragmentation of knowledge inherent in disparate theoretical paradigms"
  authors:
    - { family: Hastings, given: J. }
    - { family: Larsen, given: Rasmus Rosenberg, me: true }
  editors: [J. Tenenbaum, P. Ranallo]
  date: "2021"
  venue: "Mental health informatics: Enabling a learning mental healthcare system"
  pages: "295\u2013316"
  publisher: Springer International Publishing
  place: Cham
  tags: [psychiatry-and-ontology]
  doi: 10.1007/978-3-030-70558-9_12
  abstract: "The domain of mental health is inherently complex, spanning across multiple disciplines, data types, descriptive levels, and approaches. This complexity has brought considerable challenges in terms of how to facilitate efficient knowledge discovery and integration across disciplines in the domain. The vocabulary and semantic frameworks in use across these different descriptive levels are fragmented and contested, and it is difficult to gain an overview of what is known across all the relevant bodies of knowledge and practice. In this chapter, we review progress that has recently been made towards integrative semantic and computational frameworks for structuring and advancing mental health research. This includes the paradigm shift incubated in the NIMH’s RDoC effort, which offers a roadmap for studying the nature of the complex interactions within and between human systems: biological (body, brain), mental (mind), behavioral, social, and environmental. We also review computational approaches to infer and model relationships between entities that explicitly cross levels of explanation and disciplinary boundaries. We describe the quantitative methods that are used to integrate and analyze across heterogeneous datasets, and the epistemological challenges that face the field when attempting to determine mechanistic explanations that move the global understanding of mental health forward."

- id: larsen-2021-amused-by-the-outrageous
  status: published
  type: chapter
  title: "Amused by the outrageous: The morally tempering effect of news satire"
  authors:
    - { family: Larsen, given: Rasmus Rosenberg, me: true }
    - { family: Sackris, given: D. }
  editors: [B. Robinson]
  date: "2021"
  venue: The moral psychology of amusement
  pages: "131\u2013150"
  publisher: Rowman & Littlefield
  place: New York
  tags: [moral-and-aesthetic-judgment]
  doi: 10.5040/9798881816322.ch-8
  abstract: "In this contribution, we suggest a different approach to measuring and assessing the impact of news satire on the political process. Instead of asking the broad question of “What effect does news satire have on participatory democracy?,” we shall form a (testable) theory that seeks to qualify and guide an initial answer to the question: “What effect should we expect news satire to have on participatory democracy?” Perhaps by first developing a theory that lends itself to prediction, can we then develop better test/research paradigms. At the very least, perhaps such a theory can serve to explain why research into this area has yielded such mixed results."

- id: jalava-2021-coding-bias
  status: published
  type: article
  title: Is the psychopathic brain an artefact of coding bias? A systematic review
  authors:
    - { family: Jalava, given: J. }
    - { family: Griffiths, given: S. }
    - { family: Larsen, given: Rasmus Rosenberg, me: true }
    - { family: Alcott, given: E. B. }
  date: "2021"
  venue: Frontiers in Psychology
  volume: "12"
  pages: "654336"
  doi: 10.3389/fpsyg.2021.654336
  openalex_id: W3155932227
  pdf: https://www.frontiersin.org/articles/10.3389/fpsyg.2021.654336/pdf
  abstract: >-
    Questionable research practices are a well-recognized problem in psychology. Coding
    bias, or the tendency of review studies to disproportionately cite positive findings
    from original research, has received comparatively little attention. Coding bias is more
    likely to occur when original research, such as neuroimaging, includes large numbers of
    effects, and is most concerning in applied contexts. We evaluated coding bias in reviews
    of structural magnetic resonance imaging (sMRI) studies of PCL-R psychopathy. We used
    PRISMA guidelines to locate all relevant original sMRI studies and reviews. The
    proportion of null-findings cited in reviews was significantly lower than those reported
    in original research, indicating coding bias. Coding bias was not affected by
    publication date or review design. Reviews recommending forensic applications-such as
    treatment amenability or reduced criminal responsibility-were no more accurate than
    purely theoretical reviews. Coding bias may have contributed to a perception that
    structural brain abnormalities in psychopaths are more consistent than they actually
    are, and by extension that sMRI findings are suitable for forensic application. We
    discuss possible sources for the pervasive coding bias we observed, and we provide
    recommendations to counteract this bias in review studies. Until coding bias is
    addressed, we argue that this literature should not inform conclusions about
    psychopaths' neurobiology, especially in forensic contexts.
  tags: [psychopathy, law-and-evidence]

- id: larsen-2020-moral-psychological-impairment
  status: published
  type: article
  title: Are psychopaths moral-psychologically impaired? Reassessing emotion-theoretical explanations
  authors:
    - { family: Larsen, given: Rasmus Rosenberg, me: true }
  date: "2020"
  venue: Mind & Language
  volume: "37"
  issue: "2"
  pages: "177\u2013193"
  doi: 10.1111/mila.12317
  openalex_id: W3089335790
  pdf: https://philpapers.org/archive/LARAPM.pdf
  abstract: >-
    Psychopathy has been theorized as a disorder of emotion, which impairs moral judgments.
    However, these theories are increasingly being abandoned as empirical studies show that
    psychopaths seem to make proper moral judgments. In this contribution, these findings
    are reassessed, and it is argued that prevalent emotion‐theories of psychopathy appear
    to operate with the unjustified assumption that psychopaths have no emotions, which
    leads to the hypothesis that psychopaths are completely unable to make moral judgments.
    An alternative and novel explanation is proposed, theorizing psychopathy as a
    degree‐specific emotional deficiency, which causes degree‐specific differences in moral
    judgments.
  tags: [psychopathy, moral-and-aesthetic-judgment]
  featured: true

