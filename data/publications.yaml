- id: larsen-2019-stigma
  status: published
  type: article
  title: Psychopathy treatment and the stigma of yesterday’s research
  authors:
    - { family: Larsen, given: Rasmus Rosenberg, me: true }
  date: "2019"
  venue: Kennedy Institute of Ethics Journal
  volume: "29"
  issue: "3"
  pages: "243\u2013272"
  doi: 10.1353/ken.2019.0024
  openalex_id: W2981879119
  pdf: https://philpapers.org/archive/LARPTA.pdf
  abstract: >-
    The psychiatric diagnosis of psychopathic personality-or psychopathy-signifies a patient
    stereotype with a callous lack of empathy and strong antisocial tendencies. Throughout
    the research record and psychiatric practices, diagnosed psychopaths have been
    predominantly seen as immune to psychiatric intervention and treatment, making the
    diagnosis a potentially strong discriminator for treatment amenability. In this
    contribution, the evidence in support of this proposition is critically analyzed. It is
    demonstrated that the untreatability perspective rests largely on erroneous,
    unscientific conclusions. Instead, recent research suggests that practitioners should be
    more optimistic about the possibility of treating and rehabilitating diagnosed
    psychopaths. In light of this finding, concrete ethical challenges in the forensic
    practice surrounding the psychopathy diagnosis are discussed, adding to a growing body
    of research that expresses skepticism about the forensic utility of the diagnosis.
  tags: [psychopathy]

