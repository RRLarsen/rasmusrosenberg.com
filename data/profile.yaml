  long: |-
    Rasmus Rosenberg Larsen (PhD) is an Associate Professor of Forensic Epistemology and Philosophy of Science at the Institute of Forensic Sciences, University of Toronto Mississauga, and an Affiliated Scientist at the National Center for Ontological Research. His work lies at the intersection of psychology, epistemology, and law, with research published in journals such as The Lancet Psychiatry; Psychology, Public Policy, and Law; and Philosophical Psychology.

    Rasmus is the author of Psychopathy Unmasked: The Rise and Fall of a Dangerous Diagnosis (MIT Press), which offers a critical review of contemporary research and the judicial use of the controversial diagnosis commonly known as psychopathic personality disorder, or "psychopathy".

    Rasmus earned his PhD in Philosophy of Science from the University at Buffalo, New York. His academic and professional work reflects a commitment to improving how scientific knowledge is used in society, particularly how science can improve decision-making throughout the legal system.
