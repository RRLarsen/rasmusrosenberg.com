- id: fsc335-forensic-epistemology-scientific-knowled
  status: published
  level: undergraduate
  code: FSC335
  title: "Forensic Epistemology: Scientific Knowledge and the Legal System"
  institution: University of Toronto Mississauga
  terms: [Spring 2026, Spring 2025, Fall 2022, Spring 2021]
  description: "Epistemology is the study of the nature and limitations of human knowledge, exploring challenging questions such as: What makes some beliefs more justified than others? Why are we so compelled by the insights of modern science? Are there practical limitations to what we can know? In Forensic Epistemology, we examine how such questions apply to practices within the legal system, from criminal investigations to sentencing and correctional management. The course focuses on how scientific knowledge can be used to improve decision-making around legal issues, while identifying the limitations of forensic science more broadly. Through discussions and case studies, we cover a wide range of topics: the validity and reliability of forensic identification techniques; the demarcation of science from non-science; the influence of cognitive biases in scientific research and criminal investigations; methods in critical and statistical inferential thinking; and standards in research methods and communication."

