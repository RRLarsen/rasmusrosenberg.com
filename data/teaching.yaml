- id: fsc320-forensic-psychopathology
  status: published
  level: undergraduate
  code: FSC320
  title: "Forensic Psychopathology"
  institution: University of Toronto Mississauga
  terms: [Spring 2021, Spring 2019, Summer 2018]
  description: Pathology is the study of disease and psychopathology is the study of mental illness. In Forensic Psychopathology, then, we make inquiries about mental illness in the context of forensic practices. In this course, we will explore multiple topics in the field providing the student with a general insight into its history, scientific merits, and practical relevance. We will survey prevailing theories on mental health, illness, and treatment. Investigate psychiatric diagnoses such as (juvenile) Conduct Disorder, Antisocial Personality Disorder, and Psychopathy, hereunder their application and relevance in risk assessment, behavior prediction, and offender rehabilitation. We will also discuss methodological, ethical, and legal issues in the field, for example, the scientific validity of psychiatric diagnostics, the ethical implications of using psychiatric assessments in forensic institutions, and the legal responsibility of mentally ill offenders.

- id: phl324-the-continental-tradition
  status: published
  level: undergraduate
  code: PHL324
  title: "The Continental Tradition"
  institution: University of Toronto Mississauga
  terms: [Spring 2020, Fall 2018]
  description: A study of recent traditions of continental philosophy such as phenomenology, existentialism, hermeneutics, critical theory, structuralism and post-structuralism. Figures such as Husserl, Heidegger, Sartre, the Frankfurt school, Lacan, Foucault, Deleuze and Derrida.

- id: fsc430-seminar-in-forensic-science
  status: published
  level: undergraduate
  code: FSC430
  title: "Seminar in Forensic Science"
  institution: University of Toronto Mississauga
  terms: [Fall 2019]
  description: As a capstone course, FSC430H5 is intended to apply the unique interdisciplinary perspectives acquired by students enrolled in the Forensic Science Minor. This course will address key themes in forensics, and culminate in a collaborative course project, informed and shaped by these perspectives. Students can expect to work in partnerships, groups, or teams to investigate and discuss major issues, hot topics, historical events or growing bodies of knowledge that contribute to a broader understanding of forensic science and how it is relevant across many, if not all disciplines.

- id: phl220-existentialism
  status: published
  level: undergraduate
  code: PHL220
  title: "Existentialism"
  institution: University of Toronto Mississauga
  terms: [Spring 2019]
  description: Human perception and knowledge of reality; freedom and the meaning of human life; sexuality and the body. Authors include Heidegger, Buber, Marcel, Camus, Sartre, de Beauvoir, Merleau-Ponty.

- id: fsc350-the-psychology-of-evil
  status: published
  level: undergraduate
  code: FSC350
  title: "The Psychology of Evil"
  institution: University of Toronto Mississauga
  terms: [Fall 2018, Fall 2017]
  description: Violence and antisocial conduct is a stable mark of human nature. Though humans share some of these violent inclinations with closely related mammals, human evildoings nevertheless stand out on a number of parameters. In this course we examine these uniquely human forms of moral disengagement; from large-scale political evils such as genocides, to individualistic evils such as serial killing. We will be approaching the topic from a psychological perspective, namely, investigating the scientific accounts of the many forms of evil behaviors. While the aim of this course is to survey the psychological underpinnings of evil broadly construed, specific focus areas include defining evil from a moral psychological standpoint, analyzing contributing sociological factors, and assessing the role of psychological abnormality.

- id: phl221-philosophy-at-the-movies
  status: published
  level: undergraduate
  code: PHL221
  title: "Philosophy at the Movies"
  institution: University of Toronto Mississauga
  terms: [Summer 2018]
  description: "This course considers fundamental philosophical themes - the meaning of life and death, the nature of responsibility, fate and agency, knowledge and illusion, personal identity, alienation and belonging, love and sex, politics, ethics, and morality, among others - through film. The course also considers some questions about film as a philosophical genre: of the medium of film as an alternative medium (an alternative to language and explicit argument) of philosophical expression; of whether and how film may convey philosophical insight otherwise unavailable; and of the role of interpretation in understanding film philosophically."

- id: phl285-philosophy-of-art
  status: published
  level: undergraduate
  code: PHL285
  title: "Philosophy of Art"
  institution: University of Toronto Mississauga
  terms: [Fall 2017]
  description: A study of some of the most important philosophical questions about art. For example, what exactly is a work of art? Can any object whatsoever be, or become, an artwork? Who or what determines whether something is art? Does each person decide for themselves, or does a certain community (the "art world") decide? Can one interpretation or evaluation of a work be better, or more justified, than another? If so, how do we tell which one is better?

- id: phl2198-advanced-introduction-to-philosophy-of-s
  status: published
  level: graduate
  code: PHL2198
  title: "Advanced Introduction to Philosophy of Science"
  institution: University of Toronto
  terms: [Fall 2024]
  description: "Philosophy of science is a subbranch of philosophy concerned with the foundational aspects of scientific inquiry, such as its basic methods, epistemic limitations, and social implications. This course offers an advanced introduction to a broad range of classic, contemporary, and emerging topics in philosophy of science. Themes to be explored during the semester may include: the demarcation of science vs. non-science, the scientific method, theory formation and testing, scientific realism and empiricism, scientific progress, inductive and abductive reasoning, and modelling and taxonomic categorisation. We may also explore more applied issues such as: bias in scientific inquiry, AI and digital knowledge representation, challenges in mental health research, and the replication crisis in behavioural science."

- id: phl2196-philosophy-and-scientific-progress-the-r
  status: published
  level: graduate
  code: PHL2196
  title: "Philosophy and Scientific Progress: The Role of Formal and Applied Ontology"
  institution: University of Toronto
  terms: [Spring 2023]
  description: Philosophy is traditionally described as an academic discipline fundamentally different from those in the natural sciences such as biology, chemistry, physics, etc. An often-highlighted difference is that philosophy is characterised as a speculative or a priori approach to knowledge formation, thus strictly disjointed from the natural sciences that are predominately informed by empirical experimentation. However, recent developments in modern science have demonstrated why this “hard” distinction between philosophy and science is untenable and obscures philosophy’s role in scientific progress. In this course, we explore some of these developments, focusing mainly on contributions in the field of formal and applied ontology. To most philosophers, ontology is synonymous with metaphysics, a branch of philosophy concerned with outlining and elucidating the most basic categorisation of reality (e.g., dispositions, properties, processes, etc.). However, to a rapidly growing group of philosophers, ontology is also synonymous with a method in computer and data science broadly praised for its innovative role in advancing knowledge in an array of scientific domains (such as genomics, artificial intelligence, mental health, etc.). During the semester, we will explore the history, influence, and real achievements of formal and applied ontology; moreover, the important role we philosophers can play in advancing scientific knowledge.

- id: phl2196-philosophy-in-science-current-trends-in
  status: published
  level: graduate
  code: PHL2196
  title: "Philosophy in Science: Current Trends in Formal and Applied Ontology"
  institution: University of Toronto
  terms: [Fall 2021]
  description: Philosophy is traditionally described as a discipline fundamentally different from those in the natural sciences such as biology, chemistry, physics, etc. An often-highlighted difference is that philosophy is characterized as a speculative or a priori approach to knowledge formation, strictly disjointed from the natural sciences that are predominately informed by empirical experimentation. However, recent developments in philosophy have demonstrated why this “hard” distinction between philosophy and science is untenable and obscures philosophy’s role in scientific progress. In this course, we explore these developments, focusing mainly on contributions from the field of formal and applied ontology, and how these have innovated research methods in an array of scientific domains ranging from genetics to artificial intelligence to mental health studies. During the semester, we will cover themes in the history of metaphysics and formal ontology; innovations in, and the utility of applied ontology; and case studies from the use of (formal and applied) ontology across scientific disciplines and domains.

