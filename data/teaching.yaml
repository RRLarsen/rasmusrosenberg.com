- id: fsc239-introduction-to-forensic-science
  status: published
  level: undergraduate
  code: FSC239
  title: "Introduction to Forensic Science"
  institution: University of Toronto
  terms: [Spring 2026, Fall 2025, Spring 2025, Fall 2024]
  description: Forensic science is the application of any scientific inquiry into criminal investigation. The results of such inquiry are ultimately for presentation in courts of law. In this survey course, experts in forensic science will lecture on a variety of topics that include crime scene investigation, the role of the coroner, forensic pathology, forensic chemistry, forensic entomology, forensic anthropology, forensic dentistry, psychology, and toxicology. Case studies will be reviewed and the role of the expert witness will be examined.

- id: fsc350-psychopathy-and-crime-the-science-ethics
  status: published
  level: undergraduate
  code: FSC350
  title: "Psychopathy and Crime: The Science, Ethics, and Legal Influence of a Controversial Diagnosis"
  institution: University of Toronto Mississauga
  terms: [Fall 2025]
  open_course: psychopathy-and-crime
  materials_repo: RRLarsen/Course-Psychopathy-and-Crime
  materials_intro: >-
    This course was originally designed for third- and fourth-year undergraduate
    students in psychology, criminology, and related disciplines, based on 12 weekly
    modules of three lecture hours. The modules introduce advanced conceptual,
    empirical, and methodological issues at the intersection of psychological science,
    forensic practice, and critical reasoning. While the course is structured for
    upper-level undergraduates, the material can readily be adapted for graduate-level
    instruction with appropriate adjustments to depth, readings, and assessment.


    This page presents the core modules of the course, each accompanied by a brief
    abstract and PowerPoint lecture slides. The materials reflect an emphasis on
    conceptual clarity, epistemic rigor, and critical engagement with established
    research practices.


    All materials are open access and shared under a [Creative Commons Attribution 4.0
    (CC BY 4.0)](https://creativecommons.org/licenses/by/4.0/) license. This means that
    you are free to use, share, adapt, and redistribute these materials for educational
    or scholarly purposes, including in modified form and in your own courses. The only
    requirement is that you provide appropriate attribution to the original author
    (Rasmus Rosenberg Larsen) and indicate if changes were made. No additional
    permission is required.


    If you have questions about the course materials, or if you would like to discuss
    adaptations, collaboration, or the possibility of a guest lecture, please feel free
    to [contact me](/contact/).
  description: "This course offers a critical examination of Psychopathic Personality Disorder or “psychopathy”—a diagnosis historically associated with callousness, lack of empathy, and chronic antisocial behavior. Since the 1990s, psychopathy has played an increasingly prominent role in the U.S. and Canadian criminal justice systems, influencing decisions related to sentencing, rehabilitation, and parole. Drawing on insights from contemporary psychological research, students will explore the historical, scientific, and ethical dimensions of this controversial diagnosis. Core questions include: How dangerous are individuals labeled as psychopathic? Can psychopathic individuals benefit from treatment? Are there identifiable neurobiological markers of psychopathy? Do current theories provide a coherent account of the disorder? And, crucially, is it ethically justifiable to use the diagnosis in legal contexts? The course is based on *Psychopathy Unmasked: The Rise and Fall of a Dangerous Diagnosis* by Dr. Rasmus Rosenberg Larsen and encourages students to think critically about how contested psychological constructs shape real-world legal outcomes."

- id: fsc220-introduction-to-forensic-psychology
  status: published
  level: undergraduate
  code: FSC220
  title: "Introduction to Forensic Psychology"
  institution: University of Toronto Mississauga
  terms: [Fall 2024, Fall 2022, Fall 2021, Summer 2021, Fall 2020, Fall 2019]
  description: "This course provides an introductory overview of the many ways psychological research and theories (i.e., behavioural science) can deliver useful information in collecting and assessing evidence for criminal investigation, trial, and prevention. Topics may include: eyewitness testimony, deception, criminal profiling, false confession, mental illness, victim trauma, criminal responsibility, risk assessment, serial killing, hate crimes, sexual offending, prejudiced policing, and jury decision-making. The aim of this course is to give students general insight into the various applied specializations of forensic psychologists."

