<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CV builder</title>
  <link rel="stylesheet" href="/app.css" />
  <link rel="stylesheet" href="/wordmark.css" />
</head>
<body>
  <header class="bar">
    <a class="wordmark" href="/" title="Back to the dashboard"></a>
    <span class="divider" aria-hidden="true"></span>
    <strong class="brand">CV Builder</strong>
    <span class="status" id="status" role="status" aria-live="polite"></span>
    <div class="bar-actions">
      <button type="button" id="quick" class="ghost" title="Add an entry from a DOI, ISBN or web address">Quick add</button>
      <button type="button" id="checkpoint" class="ghost" title="Save a checkpoint of data/ that you can return to">Checkpoint</button>
      <button type="button" id="publish" class="ghost" title="Upload your checkpoints to the live website">Publish</button>
      <a class="ghost" id="open-site" href="http://localhost:4321/about/" target="_blank" rel="noopener">Open Website</a>
      <a class="ghost" href="/">Dashboard</a>
    </div>
  </header>

  <div class="layout">
    <nav class="sections" id="sections" aria-label="CV sections"></nav>

    <section class="entries" aria-label="Entries">
      <div class="entries-head">
        <h1 id="section-title">Choose a section</h1>
        <p id="section-note" class="note"></p>
        <div class="entries-tools" id="entries-tools" hidden>
          <input type="search" id="search" placeholder="Search this section" aria-label="Search this section" />
          <button type="button" id="add" class="primary">Add new entry</button>
        </div>
        <div class="entries-tools" id="inbox-tools" hidden>
          <button type="button" id="inbox-check" class="primary">Check now</button>
          <button type="button" id="inbox-sources">Sources</button>
        </div>
      </div>
      <ul class="entry-list" id="entry-list"></ul>
    </section>

    <section class="detail" aria-label="Editor and preview">
      <div class="tabs" role="tablist">
        <button type="button" role="tab" id="tab-edit" aria-selected="true">Edit</button>
        <button type="button" role="tab" id="tab-pdf" aria-selected="false">PDF preview</button>
        <label class="pdf-version" id="pdf-version" hidden>
          <select id="pdf-which" aria-label="Which PDF">
            <option value="public">Public version (no student names)</option>
            <option value="private">Private version (with student names)</option>
          </select>
        </label>
      </div>
      <div class="panel" id="panel-edit">
        <p class="empty" id="edit-empty">Choose an entry, or add a new one.</p>
        <form id="form" hidden novalidate></form>
      </div>
      <div class="panel" id="panel-pdf" hidden>
        <iframe id="pdf" title="PDF preview of the CV"></iframe>
      </div>
    </section>
  </div>

  <dialog id="quick-dialog" aria-labelledby="quick-title">
    <form method="dialog" id="quick-form">
      <h2 id="quick-title">Quick add</h2>
      <label class="lbl" for="quick-q">DOI, ISBN or web address</label>
      <input type="text" id="quick-q" autocomplete="off" placeholder="e.g. 10.1037/law0000472, 978-0-262-55220-2 or https://…" />
      <fieldset class="as">
        <legend>A web page that is not a scholarly publication becomes</legend>
        <label class="check"><input type="radio" name="as" value="media" checked /> Media (C.8)</label>
        <label class="check"><input type="radio" name="as" value="op-ed" /> Op-ed or commentary by you (C.3)</label>
      </fieldset>
      <p class="quick-msg" id="quick-msg" role="status" aria-live="polite"></p>
      <div class="actions">
        <button type="submit" class="primary" id="quick-go" value="go">Look up</button>
        <button type="button" id="quick-cancel">Cancel</button>
      </div>
    </form>
  </dialog>

  <script src="/app.js" type="module"></script>
</body>
</html>
